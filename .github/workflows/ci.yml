name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "pillow>=10,<13" pytest
      - run: python -m pytest -q

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: ticker
        uses: ./
        with:
          user: auraseb
          output_dir: out
          commit: "false"
      - name: check the output
        env:
          COUNT: ${{ steps.ticker.outputs.contributions }}
          ORGS: ${{ steps.ticker.outputs.orgs }}
        run: |
          test -s out/light.svg && test -s out/dark.svg
          python3 -c "import xml.etree.ElementTree as E; [E.parse(f) for f in ('out/light.svg', 'out/dark.svg')]"
          echo "$COUNT contributions, orgs: $ORGS"
          test "$COUNT" -gt 0
